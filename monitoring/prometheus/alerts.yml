# AI attribution: these PromQL expressions were generated by Claude (Opus 5.5).
# Prompt used: "Write Prometheus alerting rules for a Streamlit BLIP captioning
# app exposing captioner_* metrics (histogram captioner_inference_seconds,
# counter captioner_images_processed_total{status}) plus node_exporter:
# app down, node down, p95 latency, error ratio, CPU saturation, low memory,
# inference queue backlog."
groups:
  - name: caption_app
    rules:
      - alert: CaptionAppDown
        expr: up{job="caption_app"} == 0
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: "Captioning app /metrics endpoint is unreachable"
      - alert: NodeExporterDown
        expr: up{job="node"} == 0
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: "node_exporter is unreachable; host metrics are missing"
      - alert: HighInferenceLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(captioner_inference_seconds_bucket[2m]))) > 3
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "p95 inference latency above 3 s ({{ $value | humanizeDuration }})"
      - alert: HighImageErrorRatio
        expr: |
          sum(rate(captioner_images_processed_total{status="error"}[5m]))
            / sum(rate(captioner_images_processed_total[5m])) > 0.10
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "More than 10 % of images failed in the last 5 minutes"
      - alert: InferenceQueueBacklog
        expr: captioner_inference_queue_depth > 3
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "Images are queueing for the model lock (concurrent users)"
  - name: host
    rules:
      - alert: HostCpuSaturated
        expr: 100 * (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[1m]))) > 90
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "Host CPU busy above 90 % for 2 minutes"
      - alert: HostLowMemory
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "Less than 10 % RAM available; BLIP may be OOM-killed"
